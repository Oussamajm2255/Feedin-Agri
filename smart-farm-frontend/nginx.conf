# Upstream for Node.js SSR Express server
# Listens on port 4000 — handles server-rendered routes
upstream node_app {
    server 127.0.0.1:4000;
    keepalive 64;
}

server {
    listen $PORT;
    server_name feedingreen.com www.feedingreen.com;

    # ── Document root — where prerendered build files are copied ─────────
    root /usr/share/nginx/html;

    # ── Performance ─────────────────────────────────────────────────────
    # Gzip compression — reduces transfer sizes by ~60-80%
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # Serve pre-compressed files if available (.gz), avoids CPU overhead per-request
    gzip_static on;

    # ── Keep-Alive — reuse connections to reduce TCP handshake overhead ──
    keepalive_timeout 65;
    keepalive_requests 1000;

    # ── Buffers — optimised for SPA HTML + JSON API responses ───────────
    client_body_buffer_size 16k;
    output_buffers 4 32k;

    # ── Security headers ─────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # ── Static assets — 1-year immutable cache (hashed filenames) ────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # ── JSON / manifest files — short cache ──────────────────────────────
    location ~* \.(json|webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── Health check endpoint ─────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        add_header Cache-Control "no-cache" always;
    }

    # ── Main request handler ─────────────────────────────────────────────
    # Strategy:
    #   1. Try to serve the exact path as a file (static assets)
    #   2. Try as a directory with index.html (prerendered routes like /about/)
    #   3. Fall back to the SSR server for dynamic rendering
    #   4. If SSR is down (502/504), serve index.csr.html as CSR fallback
    location / {
        try_files $uri $uri/index.html @ssr_server;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ── Node.js SSR server proxy (with CSR fallback on failure) ──────────
    location @ssr_server {
        proxy_pass http://node_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # If SSR server returns 502/504 (e.g. still starting up or crashed),
        # serve the CSR fallback HTML instead of a bare error page.
        proxy_intercept_errors on;
        error_page 502 504 /index.csr.html;
    }
}
