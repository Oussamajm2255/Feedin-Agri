<section class="partner-carousel-section" aria-label="Trusted Partners">
  <div class="partner-carousel-header">
    <h2 class="partner-carousel-title">Trusted by our partners</h2>
    <p class="partner-carousel-subtitle">
      Collaborating with innovators in agriculture and technology
    </p>
  </div>

  <!-- Carousel viewport with CSS mask fade on edges -->
  <div class="carousel-viewport">
    <div class="carousel-track">
      @for (partner of doubledPartners; track $index) {
        <div class="carousel-item">
          <img
            [src]="partner.logo"
            [alt]="partner.name"
            loading="lazy"
            draggable="false"
          />
        </div>
      }
    </div>
  </div>
</section>
