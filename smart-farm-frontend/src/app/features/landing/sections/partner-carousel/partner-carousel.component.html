<section class="partner-carousel-section" aria-label="{{ 'landing.partner.title' | translate }}">
  <div class="partner-carousel-header">
    <h2 class="partner-carousel-title">{{ 'landing.partner.title' | translate }}</h2>
    <p class="partner-carousel-subtitle">
      {{ 'landing.partner.subtitle' | translate }}
    </p>
  </div>

  <!-- Carousel viewport with CSS mask fade on edges -->
  <div class="carousel-viewport">
    <div class="carousel-track">
      @for (partner of doubledPartners; track $index) {
        <div class="carousel-item">
          <img
            [src]="partner.logo"
            [alt]="partner.name"
            loading="lazy"
            draggable="false"
          />
        </div>
      }
    </div>
  </div>
</section>
